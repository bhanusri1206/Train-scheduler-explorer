<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Schedule Explorer</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header class="header">
        <h1>🚆 Train Schedule Explorer</h1>
        <p>Explore trains and plan your journey easily</p>
    </header>

    <main class="container">

        <section class="search-box">
            <h2>Find Your Train</h2>

            <form id="searchForm">

                <div class="form-group">
                    <label for="source">From Station</label>
                    <input type="text" id="source"
                        placeholder="e.g. Hyderabad"
                        list="stations" required>
                </div>

                <div class="form-group">
                    <label for="destination">To Station</label>
                    <input type="text" id="destination"
                        placeholder="e.g. Vijayawada"
                        list="stations" required>
                </div>

                <datalist id="stations">
                    <option value="Hyderabad">
                    <option value="Vijayawada">
                    <option value="Chennai">
                    <option value="Bangalore">
                    <option value="Mumbai">
                    <option value="Delhi">
                    <option value="Warangal">
                    <option value="Visakhapatnam">
                </datalist>

                <div class="form-group">
                    <label for="journeyDate">Journey Date</label>
                    <input type="date" id="journeyDate" required>
                </div>

                <button type="submit" id="searchButton">
                    Search Trains
                </button>

            </form>
        </section>

        <section class="filters">
            <h2>Filter Trains</h2>

            <div class="filter-group">
                <select id="departureFilter">
                    <option value="all">All Departure Times</option>
                    <option value="morning">Morning (5 AM - 12 PM)</option>
                    <option value="afternoon">Afternoon (12 PM - 5 PM)</option>
                    <option value="evening">Evening (5 PM - 9 PM)</option>
                    <option value="night">Night (9 PM - 5 AM)</option>
                </select>

                <select id="trainTypeFilter">
                    <option value="all">All Train Types</option>
                    <option value="Express">Express</option>
                    <option value="Superfast">Superfast</option>
                    <option value="Passenger">Passenger</option>
                    <option value="Vande Bharat">Vande Bharat</option>
                </select>
            </div>
        </section>

        <section class="results-section">
            <h2>Available Trains</h2>

            <p id="statusMessage">
                Enter your journey details to search trains.
            </p>

            <div id="trainResults" class="train-results"></div>
        </section>

    </main>

    <footer>
        <p>Train Schedule Explorer | Plan Your Journey</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
